services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: traceweave
      POSTGRES_USER: traceweave
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - traceweave_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceweave -d traceweave"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://traceweave:change_me_local_only@db:5432/traceweave
      JWT_SECRET: local-development-secret-change-before-deployment
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: TraceWeaveDemo2026!
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  traceweave_pg:
